name: CI

on:
  push:
    branches:
      - TG-18-dem-download
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: |
          python -m pytest -q || {
            code=$?
            if [ "$code" -eq 5 ] && [ -z "$(find tests -type f -name 'test_*.py')" ]; then
              echo "No tests yet"
            else
              exit "$code"
            fi
          }
